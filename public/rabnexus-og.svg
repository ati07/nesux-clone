<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>

  <!-- Grid overlay -->
  <g stroke="#D4FF00" stroke-width="1" opacity="0.04">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="490" x2="1200" y2="490"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- Ambient glow -->
  <ellipse cx="600" cy="315" rx="400" ry="200" fill="#D4FF00" opacity="0.05"/>

  <!-- Top-left brand indicator -->
  <text x="60" y="80" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#D4FF00" letter-spacing="4" opacity="0.6">DIGITAL ENGINEERING FIRM</text>

  <!-- Domain -->
  <text x="1140" y="80" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#444444" letter-spacing="2" text-anchor="end">rabnix.com</text>

  <!-- Terminal bracket icon -->
  <g transform="translate(540, 170)" stroke="#D4FF00" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 30 L -30 60 L 0 90"/>
    <path d="M 120 30 L 150 60 L 120 90"/>
    <line x1="15" y1="60" x2="105" y2="60"/>
  </g>

  <!-- RABNEXUS text -->
  <text x="600" y="340" font-family="'Cormorant Garamond', Georgia, serif" font-size="76" font-weight="300" fill="white" text-anchor="middle" letter-spacing="12">RABNIX</text>

  <!-- Industry classification -->
  <text x="600" y="390" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#A0A0A0" text-anchor="middle" letter-spacing="3">ELITE DIGITAL ENGINEERING</text>
  <text x="600" y="415" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#666666" text-anchor="middle" letter-spacing="2">BESPOKE WEBSITES · CRM · AI AGENTS · CUSTOM SOFTWARE</text>

  <!-- Bottom accent bar -->
  <rect x="450" y="450" width="300" height="2" fill="#D4FF00" opacity="0.4"/>
</svg>
