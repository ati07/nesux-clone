<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>

  <!-- Grid overlay -->
  <g stroke="#D4FF00" stroke-width="1" opacity="0.03">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="490" x2="1200" y2="490"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- Ambient glow -->
  <ellipse cx="600" cy="315" rx="400" ry="200" fill="#D4FF00" opacity="0.04"/>

  <!-- Terminal bracket icon -->
  <g transform="translate(540, 200)" stroke="#D4FF00" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 30 L -30 60 L 0 90"/>
    <path d="M 120 30 L 150 60 L 120 90"/>
    <line x1="15" y1="60" x2="105" y2="60"/>
  </g>

  <!-- RABNEXUS text -->
  <text x="600" y="360" font-family="'Cormorant Garamond', Georgia, serif" font-size="76" font-weight="300" fill="white" text-anchor="middle" letter-spacing="12">RABNEXUS</text>

  <!-- Tagline -->
  <text x="600" y="410" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#666666" text-anchor="middle" letter-spacing="6">HIGH-PRECISION DIGITAL ENGINES</text>

  <!-- Bottom border accent -->
  <line x1="400" y1="450" x2="800" y2="450" stroke="#D4FF00" stroke-width="1" opacity="0.3"/>
</svg>
