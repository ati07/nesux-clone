<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="4" fill="#0A0A0A"/>
  <!-- Grid pattern -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="0.5" opacity="0.03">
    <line x1="8" y1="0" x2="8" y2="32"/>
    <line x1="16" y1="0" x2="16" y2="32"/>
    <line x1="24" y1="0" x2="24" y2="32"/>
    <line x1="0" y1="8" x2="32" y2="8"/>
    <line x1="0" y1="16" x2="32" y2="16"/>
    <line x1="0" y1="24" x2="32" y2="24"/>
  </g>
  <!-- Terminal bracket -->
  <path d="M6 10 L2 16 L6 22" stroke="#D4FF00" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26 10 L30 16 L26 22" stroke="#D4FF00" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Horizontal line -->
  <line x1="9" y1="16" x2="23" y2="16" stroke="#D4FF00" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cursor blink -->
  <rect x="21" y="13" width="1.5" height="6" fill="#D4FF00">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
